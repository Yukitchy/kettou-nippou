<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>血糖の日報係</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23e8742c'/%3E%3Cpath d='M10 44 L24 30 L34 38 L54 16' fill='none' stroke='%231a1a1a' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="engine/style.css">
<script defer src="https://cdn.jsdelivr.net/npm/exifr@7.1.2/dist/lite.umd.js"></script>
<script defer src="engine/app.js"></script>
</head>
<body>
<main>
  <p class="brand">血糖の日報係</p>
  <section id="report" aria-live="polite"></section>
  <section id="s-curve">
    <h2>1日のカーブ</h2>
    <div id="chart"></div>
  </section>
  <section id="s-meals">
    <h2>食事</h2>
    <div id="meals"></div>
  </section>
  <details id="inputs" open>
    <summary><h2>データを入れる</h2></summary>
    <div class="inbody">
      <button id="btn-sample" type="button">サンプル3日分</button>
      <label class="drop" id="drop-csv">
        <input type="file" id="in-csv" accept=".csv,text/csv">
        <b>LibreViewのCSV</b>
        <span>ここにドロップ、またはタップして選ぶ</span>
      </label>
      <label class="drop" id="drop-photo">
        <input type="file" id="in-photo" accept="image/*" multiple>
        <b>ご飯の写真</b>
        <span>複数OK。撮影時刻から食事の時間を決めます。写真はこの端末の外に出ません</span>
      </label>
      <label class="key">
        <b>Claude APIキー（任意）</b>
        <input type="password" id="in-key" placeholder="sk-ant-..." autocomplete="off">
        <span>入れた時だけ、写真をClaudeに送って料理名と主食の量を判定します。キーはこの端末に保存</span>
      </label>
      <p id="msg" role="status"></p>
    </div>
  </details>
  <p class="foot">食べ方の目安であり、医療判断ではありません。</p>
</main>
<nav class="tabbar" aria-label="ページ内">
  <a href="#report" aria-current="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="14" r="4"/><path d="M12 4v3M4.9 8.9l2.1 2.1M19.1 8.9L17 11M2 20h20"/></svg>きのう</a>
  <a href="#s-curve"><svg viewBox="0 0 24 24"><path d="M3 17l5-6 4 3 8-9"/></svg>カーブ</a>
  <a href="#s-meals"><svg viewBox="0 0 24 24"><path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M8 7c0-1.5 1-2 1-3M12 7c0-1.5 1-2 1-3M16 7c0-1.5 1-2 1-3"/></svg>食事</a>
  <a href="#inputs"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M4 20h16"/></svg>入れる</a>
</nav>
<script>
(function(){
  var links=[].slice.call(document.querySelectorAll('.tabbar a'));
  function mark(id){links.forEach(function(a){a.getAttribute('href')==='#'+id?a.setAttribute('aria-current','true'):a.removeAttribute('aria-current')})}
  links.forEach(function(a){a.addEventListener('click',function(e){
    var id=a.getAttribute('href').slice(1),el=document.getElementById(id);
    e.preventDefault(); if(id==='inputs')el.open=true;
    (id==='report'?window.scrollTo({top:0,behavior:'smooth'}):el.scrollIntoView({behavior:'smooth',block:'start'})); mark(id);
  })});
  addEventListener('scroll',function(){
    var cur='report',y=innerHeight*.35;
    links.forEach(function(a){var el=document.getElementById(a.getAttribute('href').slice(1)); if(el&&el.getBoundingClientRect().top<y)cur=el.id});
    if(innerHeight+scrollY>=document.documentElement.scrollHeight-4)cur='inputs';
    mark(cur);
  },{passive:true});
})();
</script>
</body>
</html>
